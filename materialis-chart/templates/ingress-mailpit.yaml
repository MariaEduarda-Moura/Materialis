{{- if and .Values.mailpit.enabled .Values.mailpit.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "materialis.mailpitName" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "materialis.labels" . | nindent 4 }}
    app.kubernetes.io/component: mailpit
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  rules:
    - host: {{ .Values.mailpit.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "materialis.mailpitName" . }}
                port:
                  number: {{ .Values.mailpit.service.webPort }}
{{- end }}
